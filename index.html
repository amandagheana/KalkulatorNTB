<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator NTB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        /* Remove default arrows from number inputs for a cleaner look */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-8">

    <main class="bg-white w-full max-w-xl rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <!-- Header -->
        <header class="bg-indigo-600 p-6 text-center">
            <h1 class="text-2xl font-bold text-white tracking-tight">Kalkulator Komprehensif NTB</h1>
            <p class="text-indigo-100 text-sm mt-2 font-medium">Hitung otomatis 27a, Rasio, atau 26b</p>
        </header>

        <div class="p-6 space-y-6">
            
            <section class="bg-slate-50 p-5 rounded-xl border border-slate-200 space-y-4 shadow-sm">
                <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider border-b border-slate-200 pb-2">Komponen Penjumlahan</h2>
                
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label for="val26b" class="block text-xs font-semibold text-slate-600 mb-1.5">Nilai 26b</label>
                        <input type="number" id="val26b" step="any" class="w-full px-3 py-2.5 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-sm shadow-sm" placeholder="0">
                    </div>
                    <div>
                        <label for="val26c" class="block text-xs font-semibold text-slate-600 mb-1.5">Nilai 26c</label>
                        <input type="number" id="val26c" step="any" class="w-full px-3 py-2.5 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-sm shadow-sm" placeholder="0">
                    </div>
                    <div>
                        <label for="val26d" class="block text-xs font-semibold text-slate-600 mb-1.5">Nilai 26d</label>
                        <input type="number" id="val26d" step="any" class="w-full px-3 py-2.5 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-sm shadow-sm" placeholder="0">
                    </div>
                </div>

                <div class="pt-2">
                    <label for="sumField" class="block text-xs font-bold text-slate-700 mb-1.5">Total Sum (26b + 26c + 26d)</label>
                    <input type="number" id="sumField" readonly class="w-full px-4 py-3 bg-slate-200 border border-slate-300 rounded-lg text-slate-800 font-bold outline-none cursor-not-allowed shadow-inner" placeholder="0">
                </div>
            </section>

            <section class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label for="rasioNtb" class="block text-sm font-semibold text-slate-700 mb-1.5">Rasio NTB</label>
                    <input type="number" id="rasioNtb" step="any" class="w-full px-4 py-3 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all shadow-sm" placeholder="Masukkan Rasio">
                </div>
                
                <div>
                    <label for="val27a" class="block text-sm font-semibold text-slate-700 mb-1.5">Nilai 27a</label>
                    <input type="number" id="val27a" step="any" class="w-full px-4 py-3 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all shadow-sm" placeholder="Masukkan 27a">
                </div>
            </section>

            <section class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-4 border-t border-slate-100">
                <button onclick="calculate27a()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors shadow-md active:scale-95 text-sm flex items-center justify-center gap-2">
                    Hitung 27a
                </button>
                <button onclick="calculateRasio()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors shadow-md active:scale-95 text-sm flex items-center justify-center gap-2">
                    Hitung Rasio
                </button>
                <button onclick="calculate26b()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors shadow-md active:scale-95 text-sm flex items-center justify-center gap-2">
                    Hitung 26b
                </button>
            </section>

            <!-- Custom Message Box (Replaces alert()) -->
            <div id="messageBox" class="hidden rounded-lg p-4 text-sm font-medium text-center transition-all duration-300 shadow-sm">
                <span id="messageText"></span>
            </div>

        </div>
    </main>

    <script>
        // DOM Elements setup
        const input26b = document.getElementById('val26b');
        const input26c = document.getElementById('val26c');
        const input26d = document.getElementById('val26d');
        const inputSum = document.getElementById('sumField');
        const inputRasio = document.getElementById('rasioNtb');
        const input27a = document.getElementById('val27a');
        const messageBox = document.getElementById('messageBox');
        const messageText = document.getElementById('messageText');

        // Automatic Summation Logic
        const updateSum = () => {
            const b = parseFloat(input26b.value) || 0;
            const c = parseFloat(input26c.value) || 0;
            const d = parseFloat(input26d.value) || 0;
            
            const total = b + c + d;
            // Format to avoid long floating point issues visually if numbers get weird
            inputSum.value = Number.isInteger(total) ? total : total.toFixed(4).replace(/\.?0+$/, '');
        };

        // Attach listeners for real-time summation updates
        ['input', 'change', 'keyup'].forEach(evt => {
            input26b.addEventListener(evt, updateSum);
            input26c.addEventListener(evt, updateSum);
            input26d.addEventListener(evt, updateSum);
        });

        // Helper function for showing messages elegantly
        const showMessage = (message, type = 'error') => {
            messageText.textContent = message;
            
            // Reset classes
            messageBox.className = 'rounded-lg p-4 text-sm font-medium text-center transition-all duration-300 shadow-sm mt-2';
            
            if (type === 'error') {
                messageBox.classList.add('bg-red-50', 'text-red-700', 'border', 'border-red-200');
            } else if (type === 'success') {
                messageBox.classList.add('bg-green-50', 'text-green-700', 'border', 'border-green-200');
            }
            
            messageBox.classList.remove('hidden');
            
            // Auto hide message after 4 seconds
            setTimeout(() => {
                messageBox.classList.add('hidden');
            }, 4000);
        };

        // Format numbers for input fields nicely
        const formatNumber = (num) => {
            return Number.isInteger(num) ? num : parseFloat(num.toFixed(6));
        };

        // Button 1 Logic: Hitung 27a = (- Sum) / (Rasio - 1)
        const calculate27a = () => {
            const sum = parseFloat(inputSum.value) || 0;
            const rasio = parseFloat(inputRasio.value);

            if (isNaN(rasio)) {
                showMessage("Mohon masukkan nilai Rasio NTB terlebih dahulu.", "error");
                return;
            }

            if (rasio === 1) {
                showMessage("Rasio NTB tidak boleh 1 karena akan menyebabkan pembagian dengan nol.", "error");
                return;
            }

            const result = (-1 * sum) / (rasio - 1);
            input27a.value = formatNumber(result);
            showMessage("Berhasil menghitung 27a.", "success");
        };

        // Button 2 Logic: Hitung Rasio = 1 - (Sum / 27a)
        const calculateRasio = () => {
            const sum = parseFloat(inputSum.value) || 0;
            const val27a = parseFloat(input27a.value);

            if (isNaN(val27a)) {
                showMessage("Mohon masukkan nilai 27a terlebih dahulu.", "error");
                return;
            }

            if (val27a === 0) {
                if (sum === 0) {
                    showMessage("Tidak bisa menentukan rasio pasti jika Sum dan 27a bernilai 0.", "error");
                } else {
                    showMessage("Nilai 27a tidak boleh 0 jika Sum memiliki nilai (pembagian dengan nol).", "error");
                }
                return;
            }

            const result = 1 - (sum / val27a);
            inputRasio.value = formatNumber(result);
            showMessage("Berhasil menghitung Rasio NTB.", "success");
        };

        // Button 3 Logic: Hitung 26b = (27a * (1 - Rasio)) - 26c - 26d
        const calculate26b = () => {
            const val27a = parseFloat(input27a.value);
            const rasio = parseFloat(inputRasio.value);
            
            // Read current values of 26c and 26d, default to 0 if empty
            const c = parseFloat(input26c.value) || 0;
            const d = parseFloat(input26d.value) || 0;

            if (isNaN(val27a) || isNaN(rasio)) {
                showMessage("Mohon lengkapi nilai 27a dan Rasio NTB terlebih dahulu.", "error");
                return;
            }

            // Calculation logic
            const sumTarget = val27a * (1 - rasio);
            const result26b = sumTarget - c - d;

            // Apply value and trigger update
            input26b.value = formatNumber(result26b);
            updateSum(); // Auto-update the total sum field visually
            
            showMessage("Berhasil menghitung nilai 26b dan memperbarui total sum.", "success");
        };
    </script>
</body>
</html>
